<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kelola Buku - Admin Panel</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <h2>Admin Panel</h2>
    </div>

    <ul class="menu">
      <li><a href="admin.html" class="menu-item"><span class="icon">🏠</span><span class="text">Dashboard</span></a></li>
      <li><a href="kelola_buku.html" class="menu-item active"><span class="icon">📚</span><span class="text">Kelola Buku</span></a></li>
      <li><a href="kelola_user.html" class="menu-item"><span class="icon">👤</span><span class="text">Kelola User</span></a></li>
      <li><a href="#" class="menu-item"><span class="icon">🏷️</span><span class="text">Kategori Buku</span></a></li>
      <li><a href="#" class="menu-item"><span class="icon">📊</span><span class="text">Laporan Aktivitas</span></a></li>
      <li><a href="#" class="menu-item" id="logout-btn"><span class="icon">🚪</span><span class="text">Logout</span></a></li>
    </ul>
  </aside>

  <main class="main-content">
    <header>
      <h1>Kelola Buku</h1>
      <p>Tambahkan, lihat, dan hapus data buku yang tersimpan di sistem</p>
    </header>

    <!-- FORM TAMBAH BUKU -->
    <section class="form-section">
      <h2>➕ Tambah Buku Baru</h2>
      <form id="form-tambah-buku">
        <label for="judul">Judul Buku</label>
        <input type="text" id="judul" placeholder="Masukkan judul buku" required>

        <label for="penulis">Penulis</label>
        <input type="text" id="penulis" placeholder="Nama penulis" required>

        <label for="kategori">Kategori</label>
        <input type="text" id="kategori" placeholder="Kategori buku" required>

        <button type="submit">Tambah Buku</button>
      </form>
    </section>

    <!-- TABEL BUKU -->
    <section class="table-section">
      <h2>📘 Daftar Buku Tersimpan</h2>
      <table id="tabel-buku">
        <thead>
          <tr>
            <th>No</th>
            <th>Judul</th>
            <th>Penulis</th>
            <th>Kategori</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="toast-container"></div>
  <script src="../js/kelola_buku.js"></script>
</body>
</html>
